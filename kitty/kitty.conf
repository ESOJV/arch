font_family      JetBrainsMono Nerd Font
bold_font        auto
italic_font      auto
bold_italic_font auto
font_size        14.0

# Resize font size quickly
map ctrl+equal  change_font_size all +1.0
map ctrl+minus  change_font_size all -1.0
map ctrl+zero   change_font_size all 0

# Appearance — zenbones_dark
foreground                      #B4BDC3
background                      #1C1917
selection_foreground            #B4BDC3
selection_background            #3D4042
cursor                          #C4CACF
cursor_text_color               #1C1917
active_tab_foreground           #B4BDC3
active_tab_background           #65435E
inactive_tab_foreground         #B4BDC3
inactive_tab_background         #352F2D
color0  #1C1917
color8  #403833
color1  #DE6E7C
color9  #E8838F
color2  #819B69
color10 #8BAE68
color3  #B77E64
color11 #D68C67
color4  #6099C0
color12 #61ABDA
color5  #B279A7
color13 #CF86C1
color6  #66A5AD
color14 #65B8C1
color7  #B4BDC3
color15 #888F94

window_padding_width  12

# Universal clipboard — Ctrl+C copies if text selected, otherwise sends interrupt
map ctrl+c copy_or_interrupt
map ctrl+insert copy_to_clipboard
map ctrl+v paste_from_clipboard
map super+v paste_from_clipboard
map shift+insert paste_from_clipboard

# No bell
enable_audio_bell no
