
# Displays — single Intel iGPU now (eGPU removed); let Hyprland auto-detect the GPU.
# Catch-all FIRST so the specific rules below override it (later rules win). This
# stops the catch-all from clobbering the laptop panel's 2x scale.
monitor=,preferred,auto,1
# Laptop panel (scale 2 = HiDPI):
monitor=eDP-1,2880x1920@120,0x0,2
# Lenovo T27p 4K external (scale 1.5 → 2560x1440 logical):
monitor=desc:Lenovo Group Limited LEN T27p-10 0x37304C52,3840x2160@60,auto,1.5

# Work around Hyprland's "external monitor stays black until you move the mouse"
# hotplug bug: nudge newly added outputs to render.
exec-once = ~/.config/hypr/scripts/monitor-hotplug.sh

# Lid switch: disable internal display when closed (if external monitor present), else suspend
bindl=,switch:on:Lid Switch,exec,~/.config/hypr/scripts/lid_close.sh
bindl=,switch:off:Lid Switch,exec,~/.config/hypr/scripts/lid_open.sh


#Programs
$terminal = kitty
$fileManager = thunar
$menu = wofi --show drun

#Autostart
exec-once = mako
exec-once = awww-daemon
exec-once = wl-paste --watch cliphist store   # clipboard history (feeds walker -m clipboard)


# exec-once = nm-applet &
exec-once = waybar
exec-once = walker --gapplication-service

#Enviorment variables

env = XCURSOR_SIZE,24
env = HYPRCURSOR_SIZE,24
# macOS cursor theme (installed via home.nix pointerCursor). No hyprcursor
# build exists for it, so Hyprland falls back to the XCursor version — fine.
env = XCURSOR_THEME,macOS
env = HYPRCURSOR_THEME,macOS

#Permissions

# ecosystem {
#   enforce_permissions = 1
# }

# permission = /usr/(bin|local/bin)/grim, screencopy, allow
# permission = /usr/(lib|libexec|lib64)/xdg-desktop-portal-hyprland, screencopy, allow
# permission = /usr/(bin|local/bin)/hyprpm, plugin, allow


# Rice


general {
    gaps_in = 2
    gaps_out = 10
    border_size = 0

    resize_on_border = false
    allow_tearing = false
    layout = dwindle
}

decoration {
    rounding = 4
    rounding_power = 2

    # Change transparency of focused and unfocused windows
    active_opacity = 1.0
    inactive_opacity = 1.0

    shadow {
        enabled = true
        range = 4
        render_power = 3
        color = rgba(1a1a1aee)
    }

    blur {
        enabled = true
        size = 3
        passes = 1

        vibrancy = 0.1696
    }
}

animations {
    enabled = yes, please :)

    bezier = easeOutQuint,   0.23, 1,    0.32, 1
    bezier = easeInOutCubic, 0.65, 0.05, 0.36, 1
    bezier = linear,         0,    0,    1,    1
    bezier = almostLinear,   0.5,  0.5,  0.75, 1
    bezier = quick,          0.15, 0,    0.1,  1

    animation = global,        1,     10,    default
    animation = border,        1,     5.39,  easeOutQuint
    animation = windows,       1,     4.79,  easeOutQuint
    animation = windowsIn,     1,     4.1,   easeOutQuint, popin 87%
    animation = windowsOut,    1,     1.49,  linear,       popin 87%
    animation = fadeIn,        1,     1.73,  almostLinear
    animation = fadeOut,       1,     1.46,  almostLinear
    animation = fade,          1,     3.03,  quick
    animation = layers,        1,     3.81,  easeOutQuint
    animation = layersIn,      1,     4,     easeOutQuint, fade
    animation = layersOut,     1,     1.5,   linear,       fade
    animation = fadeLayersIn,  1,     1.79,  almostLinear
    animation = fadeLayersOut, 1,     1.39,  almostLinear
    animation = workspaces,    1,     1.94,  almostLinear, fade
    animation = workspacesIn,  1,     1.21,  almostLinear, fade
    animation = workspacesOut, 1,     1.94,  almostLinear, fade
    animation = zoomFactor,    1,     7,     quick
}

dwindle {
    pseudotile = true 
    preserve_split = true 
}

master {
    new_status = master
}

misc {
    force_default_wallpaper = 0 # Set to 0 or 1 to disable the anime mascot wallpapers
    disable_hyprland_logo = true # If true disables the random hyprland logo / anime girl background. :(
}


input {
    kb_layout = us
    kb_variant =
    kb_model =
    kb_options = ctrl:nocaps
    kb_rules =

    follow_mouse = 1

    sensitivity = 0 # -1.0 - 1.0, 0 means no modification.

    touchpad {
        natural_scroll = true
        scroll_factor = 0.2
        clickfinger_behavior = true
        tap-to-click = true
        drag_lock = true
    }
}

gesture = 3, horizontal, workspace


$mainMod = ALT

bind = $mainMod, Q, exec, $terminal
bind = $mainMod, C, sendshortcut, CTRL, Insert,
bind = $mainMod, X, sendshortcut, CTRL, X,
bind = $mainMod, V, sendshortcut, SHIFT, Insert,
bind = $mainMod CTRL, V, exec, walker -m clipboard
bind = $mainMod SHIFT, M, exec, command -v hyprshutdown >/dev/null 2>&1 && hyprshutdown || hyprctl dispatch exit
bind = $mainMod, E, exec, $fileManager
bind = $mainMod, F, fullscreen, 0
bind = $mainMod, R, exec, $menu
bind = $mainMod, B, exec, firefox
bind = $mainMod, Space, exec, $menu
bind = $mainMod, W, killactive,
bind = $mainMod, Return, exec, $terminal
bind = $mainMod, P, pseudo, # dwindle
bind = $mainMod, T, layoutmsg, togglesplit # dwindle (moved off J to free it for vim focus)

# Move focus, vim-style (hjkl) and with arrow keys
bind = $mainMod, h, movefocus, l
bind = $mainMod, j, movefocus, d
bind = $mainMod, k, movefocus, u
bind = $mainMod, l, movefocus, r
bind = $mainMod, left, movefocus, l
bind = $mainMod, right, movefocus, r
bind = $mainMod, up, movefocus, u
bind = $mainMod, down, movefocus, d

bind = $mainMod, 1, focusworkspaceoncurrentmonitor, 1
bind = $mainMod, 2, focusworkspaceoncurrentmonitor, 2
bind = $mainMod, 3, focusworkspaceoncurrentmonitor, 3
bind = $mainMod, 4, focusworkspaceoncurrentmonitor, 4
bind = $mainMod, 5, focusworkspaceoncurrentmonitor, 5
bind = $mainMod, 6, focusworkspaceoncurrentmonitor, 6
bind = $mainMod, 7, focusworkspaceoncurrentmonitor, 7
bind = $mainMod, 8, focusworkspaceoncurrentmonitor, 8
bind = $mainMod, 9, focusworkspaceoncurrentmonitor, 9
bind = $mainMod, 0, focusworkspaceoncurrentmonitor, 10

bind = $mainMod SHIFT, 1, movetoworkspace, 1
bind = $mainMod SHIFT, 2, movetoworkspace, 2
bind = $mainMod SHIFT, 3, movetoworkspace, 3
bind = $mainMod SHIFT, 4, movetoworkspace, 4
bind = $mainMod SHIFT, 5, movetoworkspace, 5
bind = $mainMod SHIFT, 6, movetoworkspace, 6
bind = $mainMod SHIFT, 7, movetoworkspace, 7
bind = $mainMod SHIFT, 8, movetoworkspace, 8
bind = $mainMod SHIFT, 9, movetoworkspace, 9
bind = $mainMod SHIFT, 0, movetoworkspace, 10

bind = $mainMod, S, exec, ~/.config/hypr/scripts/spotify.sh
bind = $mainMod SHIFT, S, movetoworkspace, special:Spotify

windowrule {
    name = spotify-scratchpad
    match:class = ^(Spotify|spotify)$
    workspace = special:Spotify, silent
}

# Notifications: dismiss the current one; SHIFT+D toggles do-not-disturb
bind = $mainMod, D, exec, makoctl dismiss
bind = $mainMod SHIFT, D, exec, makoctl mode -t do-not-disturb

bind = $mainMod, N, exec, ~/.config/hypr/scripts/nvim-vault.sh
bind = $mainMod SHIFT, N, movetoworkspace, special:NvimVault

windowrule {
    name = nvim-vault-scratchpad
    match:title = ^(nvim-vault)$
    workspace = special:NvimVault, silent
}

bind = $mainMod, mouse_down, workspace, e+1
bind = $mainMod, mouse_up, workspace, e-1

bindm = $mainMod, mouse:273, resizewindow

bind = , Print, exec, grim ~/Pictures/Screenshots/$(date +%Y%m%d_%H%M%S).png
bind = CTRL, Print, exec, grim -g "$(slurp)" - | tee ~/Pictures/Screenshots/$(date +%Y%m%d_%H%M%S).png | wl-copy

bindel = ,XF86AudioRaiseVolume, exec, wpctl set-volume -l 1 @DEFAULT_AUDIO_SINK@ 5%+
bindel = ,XF86AudioLowerVolume, exec, wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%-
bindel = ,XF86AudioMute, exec, wpctl set-mute @DEFAULT_AUDIO_SINK@ toggle
bindel = ,XF86AudioMicMute, exec, wpctl set-mute @DEFAULT_AUDIO_SOURCE@ toggle
bindel = ,XF86MonBrightnessUp, exec, brightnessctl -e4 -n2 set 5%+
bindel = ,XF86MonBrightnessDown, exec, brightnessctl -e4 -n2 set 5%-

bindl = , XF86AudioNext, exec, playerctl next
bindl = , XF86AudioPause, exec, playerctl play-pause
bindl = , XF86AudioPlay, exec, playerctl play-pause
bindl = , XF86AudioPrev, exec, playerctl previous



windowrule {
    name = suppress-maximize-events
    match:class = .*

    suppress_event = maximize
}

windowrule {
    name = fix-xwayland-drags
    match:class = ^$
    match:title = ^$
    match:xwayland = true
    match:float = true
    match:fullscreen = false
    match:pin = false

    no_focus = true
}

windowrule {
    name = move-hyprland-run

    match:class = hyprland-run

    move = 20 monitor_h-120
    float = yes
}
